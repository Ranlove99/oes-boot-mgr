name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 校验 (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 已无 Ubuntu 24.04+ 预构建包，固定在 22.04 上验证
          - python-version: '3.9'
            os: ubuntu-22.04
          - python-version: '3.11'
            os: ubuntu-latest
          - python-version: '3.12'
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试依赖
        run: python -m pip install --upgrade pip pytest

      - name: Shell / Python 语法检查
        run: make lint

      - name: 仓库一致性检查
        run: make check

      - name: 单元测试
        run: make test

      - name: 校验 fpk 入口文件齐全
        run: |
          for f in manifest ICON.PNG ICON_256.PNG cmd/main cmd/install_init \
                   cmd/install_callback config/privilege config/resource \
                   wizard/install app/server.py app/assets/oes-boot-sync.sh; do
            test -f "$f" || { echo "缺少 $f"; exit 1; }
          done
          echo "fpk 入口检查通过"
